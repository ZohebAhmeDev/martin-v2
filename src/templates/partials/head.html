<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="google-site-verification" content="ULF4zmHbM7jnqBC2epiKeEZS0wfyaHVB-6bFg_TcarI">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta name="robots" content="index, follow">

<!-- Preload critical self-hosted variable font (Latin subset, woff2) -->
<link rel="preload" href="/assets/fonts/archivo-variable-latin.woff2" as="font" type="font/woff2" crossorigin>

<!-- PWA Manifest & Icons -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">

<!-- Open Graph & Social Cards -->
<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:site_name" content="Martin Engineering &amp; Trading Co.">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:locale" content="en_IN">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OG_IMAGE_ALT}}">

<!-- Twitter Cards -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">

<!-- Compiled & Purged Tailwind CSS -->
<link rel="stylesheet" href="/assets/css/style.css">

<!-- Structured Data (JSON-LD) -->
{{JSON_LD}}
